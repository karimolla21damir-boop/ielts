<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS Listening Mock Tests</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #0f172a;
            color: #e5e7eb;
        }

        .app {
            max-width: 1180px;
            margin: 0 auto;
            padding: 24px;
        }

        h1, h2, h3 {
            margin-top: 0;
        }

        .hero {
            background: linear-gradient(135deg, #1e293b, #111827);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 22px;
            padding: 32px;
            margin-bottom: 24px;
            box-shadow: 0 18px 50px rgba(0,0,0,0.25);
        }

        .hero h1 {
            font-size: 36px;
            margin-bottom: 8px;
            color: #fff;
        }

        .subtitle {
            color: #94a3b8;
            line-height: 1.6;
        }

        .test-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 18px;
        }

        .test-card {
            background: #111827;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 18px;
            padding: 22px;
            cursor: pointer;
            transition: 0.2s;
        }

        .test-card:hover {
            transform: translateY(-4px);
            border-color: #38bdf8;
            box-shadow: 0 14px 40px rgba(56,189,248,0.12);
        }

        .test-card h2 {
            color: #fff;
            margin-bottom: 10px;
        }

        .btn {
            background: #38bdf8;
            color: #082f49;
            border: none;
            border-radius: 12px;
            padding: 12px 18px;
            font-weight: 800;
            cursor: pointer;
        }

        .btn.secondary {
            background: rgba(255,255,255,0.06);
            color: #cbd5e1;
            border: 1px solid rgba(255,255,255,0.12);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: center;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        .timer {
            background: #020617;
            border: 1px solid rgba(255,255,255,0.12);
            padding: 14px 18px;
            border-radius: 16px;
            color: #fff;
            font-size: 22px;
            font-weight: 900;
        }

        .audio-box {
            background: #111827;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 18px;
            padding: 18px;
            margin-bottom: 22px;
        }

        audio {
            width: 100%;
            margin-top: 12px;
        }

        .ielts-paper {
            background: #fff;
            color: #111827;
            border-radius: 6px;
            padding: 34px;
            max-width: 980px;
            margin: 0 auto 30px;
            line-height: 1.45;
            box-shadow: 0 18px 50px rgba(0,0,0,0.35);
        }

        .ielts-test-title {
            text-align: center;
            background: #6b7280;
            color: #fff;
            width: fit-content;
            margin: 0 auto 22px;
            padding: 5px 16px;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .ielts-listening-badge {
            display: inline-block;
            color: #6b7280;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 3px;
            margin-bottom: 26px;
        }

        .ielts-part {
            margin: 34px 0;
            page-break-inside: avoid;
        }

        .ielts-part-header {
            display: flex;
            gap: 22px;
            align-items: baseline;
            border-bottom: 1px solid #d1d5db;
            padding-bottom: 8px;
            margin-bottom: 18px;
        }

        .ielts-part-header strong {
            font-size: 18px;
        }

        .ielts-part-header em {
            color: #4b5563;
            font-weight: 700;
        }

        .ielts-instruction {
            margin: 8px 0;
            font-style: italic;
        }

        .ielts-word-limit {
            margin: 8px 0 18px;
            font-weight: 800;
            font-style: italic;
        }

        .ielts-box {
            border: 1px solid #6b7280;
            padding: 18px;
            margin: 18px 0;
        }

        .ielts-box-title {
            text-align: center;
            font-weight: 900;
            font-size: 18px;
            margin-bottom: 16px;
        }

        .ielts-subtitle {
            font-weight: 900;
            margin-top: 16px;
        }

        .ielts-list li {
            margin-bottom: 8px;
        }

        .blank {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            margin: 0 4px;
        }

        .blank-num {
            font-weight: 900;
        }

        .blank input,
        .letter-row input {
            border: none;
            border-bottom: 1px dotted #111827;
            outline: none;
            min-width: 150px;
            font-size: 15px;
            padding: 2px 4px;
            text-align: center;
        }

        .letter-row {
            display: grid;
            grid-template-columns: 38px 1fr 90px;
            gap: 10px;
            align-items: center;
            margin: 8px 0;
        }

        .letter-row input {
            min-width: 70px;
            text-transform: uppercase;
        }

        .mcq {
            margin: 16px 0;
            padding: 12px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
        }

        .mcq-title {
            font-weight: 800;
            margin-bottom: 8px;
        }

        .mcq label {
            display: block;
            margin: 7px 0;
            cursor: pointer;
        }

        .choice-box {
            border: 1px solid #9ca3af;
            max-width: 560px;
            margin: 15px auto;
            padding: 14px 20px;
        }

        .choice-box-title {
            text-align: center;
            font-weight: 900;
            margin-bottom: 10px;
        }

        .choice-line {
            display: grid;
            grid-template-columns: 34px 1fr;
            margin: 6px 0;
        }

        table.ielts-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 14px;
            font-size: 14px;
        }

        table.ielts-table th,
        table.ielts-table td {
            border: 1px solid #4b5563;
            padding: 10px;
            vertical-align: top;
        }

        table.ielts-table th {
            background: #f3f4f6;
            font-weight: 900;
        }

        .map-placeholder {
            border: 2px solid #6b7280;
            background: #f8fafc;
            padding: 14px;
            margin: 18px auto;
            max-width: 620px;
            text-align: center;
        }

        .map-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
            margin-top: 12px;
        }

        .map-cell {
            border: 1px solid #9ca3af;
            height: 58px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            background: white;
        }

        .results {
            background: #fff;
            color: #111827;
            border-radius: 18px;
            padding: 28px;
            max-width: 980px;
            margin: 0 auto;
        }

        .score {
            font-size: 42px;
            font-weight: 900;
            color: #0284c7;
        }

        .detail {
            display: grid;
            grid-template-columns: 70px 1fr 1fr 80px;
            gap: 8px;
            border-bottom: 1px solid #e5e7eb;
            padding: 8px 0;
            font-size: 14px;
        }

        .ok {
            color: #16a34a;
            font-weight: 900;
        }

        .bad {
            color: #dc2626;
            font-weight: 900;
        }

        @media (max-width: 700px) {
            .ielts-paper {
                padding: 18px;
            }

            .letter-row {
                grid-template-columns: 32px 1fr;
            }

            .letter-row input {
                grid-column: 2;
            }

            .detail {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

let timerInterval = null;

function renderHome() {
    clearInterval(timerInterval);

    document.getElementById('app').innerHTML = `
        <div class="hero">
            <h1>IELTS Listening Mock Tests</h1>
            <div class="subtitle">
                Готовые Listening Tests 1–5 в формате IELTS paper.  
                В каждом тесте есть аудио, 40 вопросов, таймер и автоматическая проверка.
            </div>
        </div>

        <div class="test-grid">
            ${Object.keys(listeningExams).map(id => `
                <div class="test-card" onclick="openTest(${id})">
                    <h2>Test ${id}</h2>
                    <div class="subtitle">${listeningExams[id].title}</div>
                    <br>
                    <button class="btn">Open Listening</button>
                </div>
            `).join('')}
        </div>
    `;
}

function openTest(id) {
    const exam = listeningExams[id];

    document.getElementById('app').innerHTML = `
        <div class="top-bar">
            <button class="btn secondary" onclick="renderHome()">← Back</button>
            <div class="timer" id="timer">30:00</div>
            <button class="btn" onclick="submitTest(${id})">Submit</button>
        </div>

        <div class="audio-box">
            <h2>🎧 Listening Test ${id}</h2>
            <div class="subtitle">Audio path: ${exam.audio}</div>
            <audio controls preload="metadata">
                <source src="${exam.audio}" type="audio/mpeg">
                Your browser does not support audio.
            </audio>
        </div>

        <div class="ielts-paper">
            ${renderPaper(id)}
        </div>

        <div style="text-align:center;margin-bottom:40px;">
            <button class="btn" style="font-size:18px;padding:16px 42px;" onclick="submitTest(${id})">Submit All Answers</button>
        </div>
    `;

    startTimer(exam.time, () => submitTest(id));
    window.scrollTo(0, 0);
}

function blank(num, width = 150) {
    return `
        <span class="blank">
            <span class="blank-num">${num}</span>
            <input id="q${num}" style="min-width:${width}px;" autocomplete="off">
        </span>
    `;
}

function letterInput(num, text) {
    return `
        <div class="letter-row">
            <strong>${num}</strong>
            <span>${text}</span>
            <input id="q${num}" maxlength="30" autocomplete="off">
        </div>
    `;
}

function mcq(num, question, options) {
    return `
        <div class="mcq">
            <div class="mcq-title">${num}. ${question}</div>
            ${options.map(opt => `
                <label>
                    <input type="radio" name="q${num}" value="${opt[0]}">
                    ${opt}
                </label>
            `).join('')}
        </div>
    `;
}

function choiceBox(title, items) {
    return `
        <div class="choice-box">
            <div class="choice-box-title">${title}</div>
            ${items.map(item => `
                <div class="choice-line">
                    <strong>${item[0]}</strong>
                    <span>${item[1]}</span>
                </div>
            `).join('')}
        </div>
    `;
}

function mapLetters() {
    return `
        <div class="map-placeholder">
            <strong>Map / Plan</strong>
            <div class="map-grid">
                ${['A','B','C','D','E','F','G','H','I','J'].map(x => `<div class="map-cell">${x}</div>`).join('')}
            </div>
        </div>
    `;
}

function renderPaper(id) {
    if (id === 1) return renderTest1();
    if (id === 2) return renderTest2();
    if (id === 3) return renderTest3();
    if (id === 4) return renderTest4();
    if (id === 5) return renderTest5();
}

function paperHeader(id) {
    return `
        <div class="ielts-test-title">TEST ${id}</div>
        <div style="text-align:center;"><div class="ielts-listening-badge">LISTENING</div></div>
    `;
}

                    <li>Some experiences are considered ${blank(34)} by others.</li>
                    <li>George Washington organised a ${blank(35)} about Cato.</li>
                    <li>Adam Smith’s ideas on ${blank(36)} were influenced by Stoicism.</li>
                    <li>Treatment for ${blank(37)} is based on Stoic ideas.</li>
                    <li>People learn to base thinking on ${blank(38)}</li>
                    <li>In business, obstacles can be seen as ${blank(39)}</li>
                    <li>Stoicism requires a lot of ${blank(40)}</li>
                </ul>
            </div>
        </section>
    `;
}

function normalizeAnswer(value) {
    return String(value || '')
        .trim()
        .toLowerCase()
        .replace(/[’']/g, '')
        .replace(/\s+/g, ' ');
}

function getUserAnswer(qNum) {
    const textInput = document.getElementById(`q${qNum}`);
    if (textInput) {
        return textInput.value.trim();
    }

    const radio = document.querySelector(`input[name="q${qNum}"]:checked`);
    if (radio) {
        return radio.value;
    }

    return '';
}

function getSpecialGroups(testId) {
    const groups = {
        1: [
            { questions: [29, 30], answers: ['B', 'D'] }
        ],
        2: [
            { questions: [21, 22], answers: ['B', 'D'] },
            { questions: [23, 24], answers: ['B', 'C'] }
        ],
        3: [
            { questions: [17, 18], answers: ['B', 'D'] },
            { questions: [19, 20], answers: ['A', 'E'] }
        ],
        4: [
            { questions: [17, 18], answers: ['A', 'D'] },
            { questions: [19, 20], answers: ['A', 'C'] }
        ],
        5: [
            { questions: [21, 22], answers: ['C', 'E'] },
            { questions: [23, 24], answers: ['A', 'B'] }
        ]
    };

    return groups[testId] || [];
}

function isCorrect(user, expected) {
    const u = normalizeAnswer(user);

    if (Array.isArray(expected)) {
        return expected.map(normalizeAnswer).includes(u);
    }

    return u === normalizeAnswer(expected);
}

function getBand(score) {
    if (score >= 39) return '9.0';
    if (score >= 37) return '8.5';
    if (score >= 35) return '8.0';
    if (score >= 32) return '7.5';
    if (score >= 30) return '7.0';
    if (score >= 26) return '6.5';
    if (score >= 23) return '6.0';
    if (score >= 18) return '5.5';
    if (score >= 16) return '5.0';
    if (score >= 13) return '4.5';
    if (score >= 10) return '4.0';
    return '3.5';
}

function submitTest(id) {
    clearInterval(timerInterval);

    const exam = listeningExams[id];
    const specialGroups = getSpecialGroups(id);
    const grouped = new Set();

    specialGroups.forEach(group => {
        group.questions.forEach(q => grouped.add(q));
    });

    let correct = 0;
    let total = 40;
    const details = [];

    exam.sections.forEach(section => {
        section.questions.forEach(item => {
            if (grouped.has(item.q)) return;

            const user = getUserAnswer(item.q);
            const ok = isCorrect(user, item.answer);

            if (ok) correct++;

            details.push({
                q: item.q,
                user,
                correct: Array.isArray(item.answer) ? item.answer.join(' / ') : item.answer,
                ok
            });
        });
    });

    specialGroups.forEach(group => {
        const userAnswers = group.questions.map(q => normalizeAnswer(getUserAnswer(q)));
        const expectedAnswers = group.answers.map(normalizeAnswer);

        const noEmpty = userAnswers.every(Boolean);
        const noDuplicates = new Set(userAnswers).size === userAnswers.length;
        const allCorrect = userAnswers.every(ans => expectedAnswers.includes(ans));
        const groupOk = noEmpty && noDuplicates && allCorrect;

        group.questions.forEach(q => {
            if (groupOk) correct++;

            details.push({
                q,
                user: getUserAnswer(q),
                correct: group.answers.join(' / '),
                ok: groupOk
            });
        });
    });

    details.sort((a, b) => a.q - b.q);

    document.getElementById('app').innerHTML = `
        <button class="btn secondary" onclick="renderHome()">← Back to tests</button>

        <div class="results">
            <h1>Listening Test ${id} Results</h1>
            <div class="score">${correct}/40</div>
            <h2>Band: ${getBand(correct)}</h2>

            <div style="margin-top:24px;">
                <div class="detail" style="font-weight:900;">
                    <div>№</div>
                    <div>Your answer</div>
                    <div>Correct answer</div>
                    <div>Status</div>
                </div>

                ${details.map(d => `
                    <div class="detail">
                        <div><strong>${d.q}</strong></div>
                        <div>${d.user || '<em>empty</em>'}</div>
                        <div>${d.correct}</div>
                        <div class="${d.ok ? 'ok' : 'bad'}">${d.ok ? '✓' : '✗'}</div>
                    </div>
                `).join('')}
            </div>
        </div>
    `;

    window.scrollTo(0, 0);
}

function startTimer(seconds, onEnd) {
    clearInterval(timerInterval);

    let left = seconds;

    function update() {
        const min = Math.floor(left / 60);
        const sec = left % 60;
        const el = document.getElementById('timer');

        if (el) {
            el.textContent = `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
        }

        if (left <= 0) {
            clearInterval(timerInterval);
            onEnd();
        }

        left--;
    }

    update();
    timerInterval = setInterval(update, 1000);
}

renderHome();
</script>
