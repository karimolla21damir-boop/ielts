<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');

        :root {
            --primary: #6366f1;
            --accent: #a855f7;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.8);
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg);
            color: #f1f5f9;
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 260px;
            background: #111827;
            border-right: 1px solid var(--border);
            padding: 30px 20px;
            position: fixed;
            height: 100vh;
            z-index: 1000;
        }

        .insta-link {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #e2e8f0;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 15px;
            border-radius: 12px;
            margin-bottom: 25px;
            border: 1px solid var(--border);
            transition: 0.3s;
        }
        .insta-link:hover {
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            border-color: transparent;
            transform: translateY(-2px);
        }
        .insta-link span { font-size: 13px; font-weight: 600; }

        .nav-links { list-style: none; padding: 0; margin-top: 20px; }
        .nav-links li { margin-bottom: 10px; }
        .nav-links a { 
            color: #94a3b8; text-decoration: none; padding: 12px 15px; 
            display: block; border-radius: 10px; cursor: pointer; transition: 0.3s;
        }
        .nav-links a:hover, .nav-links a.active { background: var(--primary); color: white; }

        .header-progress {
            position: fixed;
            top: 0;
            left: 260px;
            right: 0;
            padding: 15px 40px;
            background: rgba(15, 23, 42, 0.9);
            z-index: 900;
            border-bottom: 1px solid var(--border);
        }
        .progress-bar-bg { background: rgba(255,255,255,0.05); height: 8px; border-radius: 4px; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: linear-gradient(to right, var(--primary), var(--accent)); width: 0%; transition: 0.5s; }

        .main-wrap { 
            margin-left: 260px; 
            padding: 100px 40px 40px; 
            width: calc(100% - 260px);
            display: flex;
            justify-content: center;
        }

        .card { 
            width: 100%;
            max-width: 900px;
            background: var(--card-bg); 
            border: 1px solid var(--border); 
            border-radius: 30px; 
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .video-wrapper { width: 100%; margin: 20px 0; border-radius: 20px; overflow: hidden; border: 1px solid var(--border); }
        .youtube-container { position: relative; padding-bottom: 56.25%; height: 0; }
        .youtube-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

        .quiz-container { text-align: left; background: rgba(255,255,255,0.02); padding: 30px; border-radius: 20px; margin: 30px 0; border: 1px solid var(--border); }
        .quiz-item { margin-bottom: 25px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 15px; }
        .quiz-options button { 
            display: block; width: 100%; text-align: left; padding: 12px; margin: 8px 0; 
            background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: white; 
            border-radius: 8px; cursor: pointer; 
        }

        .pdf-section { width: 100%; margin-top: 30px; }
        .pdf-wrapper { 
            width: 100% !important; 
            height: 800px !important; 
            background: white; 
            border-radius: 15px; 
            overflow: hidden;
            border: 2px solid var(--border);
        }
        .pdf-wrapper iframe { width: 100%; height: 100%; border: none; }

        .mock-btn { 
            background: linear-gradient(135deg, #f43f5e, #e11d48); color: white; 
            border: none; padding: 18px 35px; border-radius: 15px; font-weight: 800; 
            cursor: pointer; margin-top: 30px; width: 100%; font-size: 16px;
        }

        /* Mock Hub Styles */
        .mock-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 25px; }
        .mock-card {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px; padding: 25px; cursor: pointer; transition: 0.3s;
        }
        .mock-card:hover { transform: translateY(-5px); border-color: #6366f1; box-shadow: 0 15px 40px rgba(99,102,241,0.2); }
        .mock-card h3 { margin: 0 0 8px; font-size: 16px; }
        .mock-card p { margin: 0; font-size: 12px; color: #64748b; }
        .mock-tag { display: inline-block; padding: 3px 10px; border-radius: 6px; font-size: 11px; font-weight: 600; margin-right: 6px; margin-top: 10px; }
        .mock-tag.listening { background: rgba(99,102,241,0.15); color: #818cf8; }
        .mock-tag.reading { background: rgba(16,185,129,0.15); color: #34d399; }
        .mock-tag.writing { background: rgba(245,158,11,0.15); color: #fbbf24; }
        .mock-tag.speaking { background: rgba(239,68,68,0.15); color: #f87171; }
        .mock-tag.easy { background: rgba(16,185,129,0.15); color: #34d399; }
        .mock-tag.medium { background: rgba(245,158,11,0.15); color: #fbbf24; }
        .mock-tag.hard { background: rgba(239,68,68,0.15); color: #f87171; }
        .filter-tabs { display: flex; gap: 10px; flex-wrap: wrap; margin: 20px 0; }
        .filter-tab {
            padding: 8px 20px; border-radius: 50px; border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.03); color: #94a3b8; font-weight: 600;
            font-size: 13px; cursor: pointer; transition: 0.3s;
        }
        .filter-tab:hover { background: rgba(255,255,255,0.08); color: white; }
        .filter-tab.active { background: linear-gradient(135deg, #6366f1, #a855f7); color: white; border-color: transparent; }
        .answer-section { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 25px; margin-top: 20px; }
        .answer-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 6px; margin-top: 10px; }
        .answer-item { padding: 6px 10px; background: rgba(255,255,255,0.03); border-radius: 6px; font-size: 13px; color: #94a3b8; }
    </style>
</head>

        ];

        let mockFilter = 'all';

        function showMockHub() {
            mockFilter = 'all';
            renderMockHub();
        }

        function renderMockHub() {
            const filters = ['all','listening','reading','writing','speaking'];
            const labels = ['🌐 All','🎧 Listening','📖 Reading','✍️ Writing','🗣️ Speaking'];
            const filtered = mockFilter === 'all' ? mockTestsData : mockTestsData.filter(t => t.type === mockFilter);

            let tabsHtml = filters.map((f,i) =>
                `<div class="filter-tab ${f===mockFilter?'active':''}" onclick="mockFilter='${f}';renderMockHub()">${labels[i]}</div>`
            ).join('');

            let cardsHtml = filtered.map(t => `
                <div class="mock-card" onclick="openMock(${t.id})">
                    <h3>${t.title}</h3>
                    <p>⏱ ${t.time} &nbsp; ❓ ${t.qs} questions</p>
                    <span class="mock-tag ${t.type}">${t.type}</span>
                    <span class="mock-tag ${t.diff}">${t.diff}</span>
                    ${t.video ? '<span class="mock-tag listening">🎬 Video</span>' : ''}
                </div>
            `).join('');

            document.getElementById('main-content').innerHTML = `
                <h1 style="background:linear-gradient(135deg,#6366f1,#a855f7,#f43f5e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center;">📝 Mock Tests Hub</h1>
                <p style="text-align:center;color:#94a3b8;">Practice with real IELTS-style tests — ${mockTestsData.length} tests available</p>
                <div class="filter-tabs">${tabsHtml}</div>
                <div class="mock-grid">${cardsHtml}</div>
            `;
            window.scrollTo(0,0);
        }

        function openMock(id) {
            const t = mockTestsData.find(m => m.id === id);
            if (!t) return;

            let videoHtml = '';
            if (t.video) {
                videoHtml = `
                    <h2 style="text-align:left;">🎬 Audio / Video</h2>
                    <div class="video-wrapper"><div class="youtube-container">
                        <iframe src="https://www.youtube.com/embed/${t.video}" allowfullscreen></iframe>
                    </div></div>`;
            }

            let answersHtml = '';
            if (t.answers) {
                answersHtml = '<div style="margin-top:30px;"><h2>📋 Answers / Tasks</h2>';
                for (const section in t.answers) {
                    answersHtml += `<div class="answer-section"><h3 style="color:#a855f7;margin:0 0 10px;">${section}</h3><div class="answer-grid">`;
                    t.answers[section].forEach((ans, i) => {
                        answersHtml += `<div class="answer-item"><b style="color:#6366f1;">${i+1}.</b> ${ans}</div>`;
                    });
                    answersHtml += '</div></div>';
                }
                answersHtml += '</div>';
            }

            document.getElementById('main-content').innerHTML = `
                <button onclick="renderMockHub()" style="color:#94a3b8;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);padding:10px 20px;border-radius:12px;cursor:pointer;font-weight:600;margin-bottom:20px;">← Back to Mock Tests</button>
                <h1 style="text-align:left;">${t.title}</h1>
                <p style="color:#64748b;">⏱ ${t.time} &nbsp; ❓ ${t.qs} questions &nbsp; 📊 ${t.diff}</p>
                ${videoHtml}
                ${answersHtml}
            `;
            window.scrollTo(0,0);
        }
    </script>
