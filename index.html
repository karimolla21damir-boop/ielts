<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS Master - Lyazat Teacher</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');

        :root {
            --primary: #6366f1;
            --accent: #a855f7;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.8);
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg);
            color: #f1f5f9;
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 260px; background: #111827; border-right: 1px solid var(--border);
            padding: 30px 20px; position: fixed; height: 100vh; z-index: 1000; overflow-y: auto;
        }

        .insta-link {
            display: flex; align-items: center; gap: 10px; text-decoration: none;
            color: #e2e8f0; background: rgba(255,255,255,0.05); padding: 10px 15px;
            border-radius: 12px; margin-bottom: 25px; border: 1px solid var(--border); transition: 0.3s;
        }
        .insta-link:hover {
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            border-color: transparent; transform: translateY(-2px);
        }
        .insta-link span { font-size: 13px; font-weight: 600; }

        .nav-links { list-style: none; padding: 0; margin-top: 20px; }
        .nav-links li { margin-bottom: 10px; }
        .nav-links a {
            color: #94a3b8; text-decoration: none; padding: 12px 15px;
            display: block; border-radius: 10px; cursor: pointer; transition: 0.3s;
        }
        .nav-links a:hover, .nav-links a.active { background: var(--primary); color: white; }

        .header-progress {
            position: fixed; top: 0; left: 260px; right: 0;
            padding: 15px 40px; background: rgba(15,23,42,0.9);
            z-index: 900; border-bottom: 1px solid var(--border);
        }
        .progress-bar-bg { background: rgba(255,255,255,0.05); height: 8px; border-radius: 4px; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: linear-gradient(to right, var(--primary), var(--accent)); width: 0%; transition: 0.5s; }

        .main-wrap {
            margin-left: 260px; padding: 100px 40px 40px;
            width: calc(100% - 260px); display: flex; justify-content: center;
        }

        .card {
            width: 100%; max-width: 1100px; background: var(--card-bg);
            border: 1px solid var(--border); border-radius: 30px;
            padding: 40px; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .video-wrapper { width: 100%; margin: 20px 0; border-radius: 20px; overflow: hidden; border: 1px solid var(--border); }
        .youtube-container { position: relative; padding-bottom: 56.25%; height: 0; }
        .youtube-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

        .quiz-container { text-align: left; background: rgba(255,255,255,0.02); padding: 30px; border-radius: 20px; margin: 30px 0; border: 1px solid var(--border); }
        .quiz-item { margin-bottom: 25px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 15px; }
        .quiz-options button {
            display: block; width: 100%; text-align: left; padding: 12px; margin: 8px 0;
            background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: white;
            border-radius: 8px; cursor: pointer;
        }

        .pdf-section { width: 100%; margin-top: 30px; }
        .pdf-wrapper {
            width: 100% !important; height: 800px !important; background: white;
            border-radius: 15px; overflow: hidden; border: 2px solid var(--border);
        }
        .pdf-wrapper iframe { width: 100%; height: 100%; border: none; }

        .mock-btn {
            background: linear-gradient(135deg, #f43f5e, #e11d48); color: white;
            border: none; padding: 18px 35px; border-radius: 15px; font-weight: 800;
            cursor: pointer; margin-top: 30px; width: 100%; font-size: 16px;
        }

        /* Mock Hub */
        .mock-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 25px; }
        .mock-card {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px; padding: 25px; cursor: pointer; transition: 0.3s;
        }
        .mock-card:hover { transform: translateY(-5px); border-color: #6366f1; box-shadow: 0 15px 40px rgba(99,102,241,0.2); }
        .mock-card h3 { margin: 0 0 8px; font-size: 16px; }
        .mock-card p { margin: 0; font-size: 12px; color: #64748b; }
        .mock-tag { display: inline-block; padding: 3px 10px; border-radius: 6px; font-size: 11px; font-weight: 600; margin-right: 6px; margin-top: 10px; }
        .mock-tag.listening { background: rgba(99,102,241,0.15); color: #818cf8; }
        .mock-tag.reading { background: rgba(16,185,129,0.15); color: #34d399; }
        .mock-tag.writing { background: rgba(245,158,11,0.15); color: #fbbf24; }
        .mock-tag.speaking { background: rgba(239,68,68,0.15); color: #f87171; }
        .mock-tag.easy { background: rgba(16,185,129,0.15); color: #34d399; }
        .mock-tag.medium { background: rgba(245,158,11,0.15); color: #fbbf24; }
        .mock-tag.hard { background: rgba(239,68,68,0.15); color: #f87171; }
        .filter-tabs { display: flex; gap: 10px; flex-wrap: wrap; margin: 20px 0; }
        .filter-tab {
            padding: 8px 20px; border-radius: 50px; border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.03); color: #94a3b8; font-weight: 600;
            font-size: 13px; cursor: pointer; transition: 0.3s;
        }
        .filter-tab:hover { background: rgba(255,255,255,0.08); color: white; }
        .filter-tab.active { background: linear-gradient(135deg, #6366f1, #a855f7); color: white; border-color: transparent; }

        /* EXAM STYLES */
        .exam-timer {
            position: sticky; top: 70px; z-index: 50;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 1px solid var(--border); border-radius: 16px;
            padding: 15px 25px; margin-bottom: 25px;
            display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
        }
        .timer-clock {
            font-size: 28px; font-weight: 800; color: #f43f5e;
            font-family: 'Courier New', monospace; letter-spacing: 2px;
        }
        .timer-btns { display: flex; gap: 10px; }
        .timer-btns button {
            padding: 8px 18px; border-radius: 10px; border: 1px solid var(--border);
            background: rgba(255,255,255,0.05); color: white; cursor: pointer;
            font-weight: 600; font-size: 13px; transition: 0.3s;
        }
        .timer-btns button:hover { background: var(--primary); }
        .submit-btn { background: linear-gradient(135deg, #10b981, #059669) !important; border-color: transparent !important; }

        .exam-split { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; }
        .exam-panel {
            background: rgba(255,255,255,0.03); border: 1px solid var(--border);
            border-radius: 20px; padding: 30px; max-height: 70vh; overflow-y: auto;
        }
        .exam-panel h3 { margin-top: 0; }
        .exam-panel p { color: #cbd5e1; line-height: 1.8; font-size: 14px; }

        .eq-item { margin-bottom: 18px; padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .eq-item label { display: block; color: #94a3b8; font-size: 13px; margin-bottom: 6px; font-weight: 600; }
        .eq-input {
            width: 100%; padding: 10px 14px; background: rgba(255,255,255,0.05);
            border: 1px solid var(--border); border-radius: 10px; color: white;
            font-size: 14px; outline: none; transition: 0.3s; box-sizing: border-box;
        }
        .eq-input:focus { border-color: var(--primary); box-shadow: 0 0 10px rgba(99,102,241,0.3); }

        .eq-mcq { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
        .eq-mcq label {
            display: flex; align-items: center; gap: 10px; padding: 8px 12px;
            background: rgba(255,255,255,0.03); border: 1px solid var(--border);
            border-radius: 8px; cursor: pointer; transition: 0.3s; font-weight: 400; color: #cbd5e1;
        }
        .eq-mcq label:hover { background: rgba(255,255,255,0.06); }
        .eq-mcq input[type="radio"] { accent-color: var(--primary); }

        .exam-audio {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 1px solid var(--border); border-radius: 16px;
            padding: 20px 25px; margin-bottom: 20px; text-align: center;
        }

        .section-title {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            font-size: 20px; font-weight: 800; margin: 30px 0 15px; padding-top: 15px;
            border-top: 2px solid var(--border);
        }

        .writing-area {
            width: 100%; min-height: 350px; padding: 20px;
            background: rgba(255,255,255,0.05); border: 1px solid var(--border);
            border-radius: 16px; color: white; font-size: 15px;
            font-family: 'Plus Jakarta Sans', sans-serif; line-height: 1.8;
            resize: vertical; outline: none; box-sizing: border-box;
        }
        .writing-area:focus { border-color: var(--primary); }
        .word-count { text-align: right; color: #64748b; font-size: 13px; margin-top: 8px; }

        .band-score {
            font-size: 72px; font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--accent), #f43f5e);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .results-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 8px; margin-top: 20px; text-align: left;
        }
        .res-correct { padding: 8px 12px; border-radius: 8px; font-size: 13px; background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.3); color: #34d399; }
        .res-wrong { padding: 8px 12px; border-radius: 8px; font-size: 13px; background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #f87171; }

        .ai-feedback {
            background: linear-gradient(135deg, rgba(99,102,241,0.1), rgba(168,85,247,0.1));
            border: 1px solid rgba(168,85,247,0.3); border-radius: 20px;
            padding: 30px; margin-top: 25px;
        }
        .ai-feedback h3 { color: var(--accent); }
        .ai-feedback p { color: #cbd5e1; line-height: 1.8; }

        .speaking-card {
            background: rgba(255,255,255,0.03); border: 1px solid var(--border);
            border-radius: 20px; padding: 25px; margin-bottom: 20px;
        }
        .speaking-card h3 { color: var(--accent); margin-top: 0; }

        .exam-panel::-webkit-scrollbar { width: 6px; }
        .exam-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

        @media (max-width: 900px) { .exam-split { grid-template-columns: 1fr; } }
    </style>
</head>

let completed = new Set();
function checkQuiz(btn, isCorrect) {
    btn.style.background = isCorrect ? "#16a34a" : "#dc2626";
    btn.style.color = "white";
}
function showModule(name) {
    const key = name.toLowerCase();
    completed.add(key);
    document.getElementById('p-fill').style.width = (completed.size/4*100)+"%";
    document.getElementById('p-percent').innerText = (completed.size/4*100)+"%";
    let quizHtml = quizData[key].map((item,idx) => `
        <div class="quiz-item"><p><b>${idx+1}. ${item.q}</b></p>
        <div class="quiz-options">${item.a.map((opt,i) => `<button onclick="checkQuiz(this,${i===item.correct})">${opt}</button>`).join('')}</div></div>
    `).join('');
    document.getElementById('main-content').innerHTML = `
        <h1 style="text-align:left;">${name} Module</h1>
        <div class="video-wrapper"><div class="youtube-container">
            <iframe src="https://www.youtube.com/embed/${ytData.lessons[key]}" allowfullscreen></iframe>

}

    window.scrollTo(0,0);

            {
                title: "The Impact of Climate Change on Coral Reefs",
                text: `Coral reefs are among the most biologically diverse ecosystems on Earth, supporting approximately 25% of all marine species despite covering less than 1% of the ocean floor. These underwater structures are built by colonies of tiny animals called coral polyps, which secrete calcium carbonate to form hard, protective skeletons.

Over the past three decades, scientists have observed a dramatic decline in coral reef health worldwide. Rising ocean temperatures, primarily caused by increased greenhouse gas emissions, have led to a phenomenon known as coral bleaching. When water temperatures rise even 1-2°C above the normal summer maximum, corals expel the symbiotic algae living in their tissues, causing them to turn white.

The Great Barrier Reef in Australia, the world's largest coral reef system, has experienced mass bleaching events in 2016, 2017, and 2020. Research conducted by the Australian Institute of Marine Science found that approximately 50% of the reef's coral cover has been lost since 1995. Professor James Cook from the University of Queensland stated that the frequency of bleaching events has increased fivefold since the 1980s.

Ocean acidification presents another significant threat. As the ocean absorbs CO2 from the atmosphere, its pH decreases, making it more difficult for corals to build their calcium carbonate skeletons. Studies indicate that ocean acidity has increased by 26% since the Industrial Revolution.

However, recent research has revealed that some coral species demonstrate remarkable resilience. Scientists at the Hawaii Institute of Marine Biology discovered that certain corals can adapt to higher temperatures through changes in their symbiotic algae communities.`,

            {
                title: "The History of Urban Planning",
                text: `Urban planning as a formal discipline emerged in the late 19th century as a response to the squalid conditions in rapidly industrializing cities. Before this period, cities grew organically, with little regard for public health, transportation, or aesthetics. The Industrial Revolution brought millions of workers into cities, creating overcrowded slums where disease spread rapidly.

In 1898, Ebenezer Howard published "To-Morrow: A Peaceful Path to Real Reform," in which he proposed the concept of Garden Cities — planned communities surrounded by greenbelts that would combine the best of urban and rural living. His ideas led to the creation of Letchworth Garden City in 1903 and Welwyn Garden City in 1920, both in England.

function startTimer(seconds, onEnd) {
    clearInterval(examTimer);

    updateTimerDisplay();

        updateTimerDisplay();
        if(examSeconds <= 0) { clearInterval(examTimer); if(onEnd) onEnd(); }

}
function updateTimerDisplay() {
    const el = document.getElementById('exam-clock');

    const m = Math.floor(examSeconds/60);
    const s = examSeconds%60;
    el.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;

}

// ===== BAND SCORE CALC =====
function getBand(correct, total) {
    const pct = correct/total*100;
    if(pct>=90) return 9; if(pct>=80) return 8.5; if(pct>=70) return 8;
    if(pct>=60) return 7.5; if(pct>=53) return 7; if(pct>=47) return 6.5;
    if(pct>=40) return 6; if(pct>=33) return 5.5; if(pct>=27) return 5;
    if(pct>=20) return 4.5; if(pct>=13) return 4; return 3.5;
}

function switchPassage(idx) {
    // Скрываем только пассажи внутри панели
    const passagePanel = document.getElementById('passage-panel');
    const questionPanel = document.getElementById('question-panel');
    
    if(passagePanel) {
        passagePanel.querySelectorAll('[id^="passage-"]').forEach(el => el.style.display = 'none');
    }
    if(questionPanel) {
        questionPanel.querySelectorAll('[id^="qs-"]').forEach(el => el.style.display = 'none');
    }
    
    document.querySelectorAll('[id^="ptab-"]').forEach(el => el.classList.remove('active'));
    
    const p = document.getElementById('passage-'+idx);
    const q = document.getElementById('qs-'+idx);
    const t = document.getElementById('ptab-'+idx);
    if(p) p.style.display = 'block';
    if(q) q.style.display = 'block';
    if(t) t.classList.add('active');
}
}

function submitReading(idx) {
    clearInterval(examTimer);
    const exam = readingExams[idx] || readingExams[1];
    let correct = 0;
    let total = 0;
    let details = [];

    exam.passages.forEach(p => {
        p.questions.forEach(q => {
            total++;
            const qNum = q.q.substring(0,3).trim();
            let userAnswer = '';

            if(q.type === 'tf' || q.type === 'mcq') {
                const radios = document.querySelectorAll(`input[name="q${qNum}"]`);
                radios.forEach(r => { if(r.checked) userAnswer = r.value; });
            } else {
                const inp = document.getElementById('inp-'+qNum);
                if(inp) userAnswer = inp.value.trim();
            }

            const isCorrect = userAnswer.toLowerCase() === q.answer.toLowerCase();
            if(isCorrect) correct++;
            details.push({q: q.q, user: userAnswer || '(empty)', correct: q.answer, ok: isCorrect});
        });
    });

    const band = getBand(correct, total);
    showResults('Reading', correct, total, band, details);
}

            if(q.type === 'fill') {
                sectionsHtml += `<div class="eq-item"><label>${q.q}</label>
                    <input type="text" class="eq-input" id="linp-${qNum}" placeholder="Type your answer..."></div>`;
            } else {
                sectionsHtml += `<div class="eq-item"><label>${q.q}</label><div class="eq-mcq">
                    ${q.opts.map(o => `<label><input type="radio" name="lq${qNum}" value="${o.charAt(0)}"> ${o}</label>`).join('')}
                </div></div>`;
            }
        });
    });

    document.getElementById('main-content').innerHTML = `
        <button onclick="renderMockHub()" style="color:#94a3b8;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);padding:10px 20px;border-radius:12px;cursor:pointer;font-weight:600;margin-bottom:15px;">← Back</button>
        <h1>🎧 Listening Test ${id}</h1>
        <div class="exam-timer">
            <div><div style="color:#64748b;font-size:11px;text-transform:uppercase;">Time Remaining</div>
            <div class="timer-clock" id="exam-clock">30:00</div></div>
            <div class="timer-btns">
                <button class="submit-btn" onclick="submitListening(${id})">✅ Submit</button>
            </div>
        </div>
        <div class="exam-audio">
            <h3>🎧 Listen carefully — audio plays once</h3>
            <div class="youtube-container" style="max-width:800px;margin:0 auto;">
                <iframe src="https://www.youtube.com/embed/${exam.video}" allowfullscreen></iframe>
            </div>
        </div>
        <div class="exam-panel" style="max-height:none;">${sectionsHtml}</div>`;

    startTimer(exam.time, () => submitListening(id));
    window.scrollTo(0,0);
}

function submitListening(id) {
    clearInterval(examTimer);
    const exam = listeningExams[id] || listeningExams[1];
    let correct = 0, total = 0, details = [];

    exam.sections.forEach(sec => {
        sec.questions.forEach(q => {
            total++;
            const qNum = q.q.substring(0,3).trim();
            let userAnswer = '';
            if(q.type === 'fill') {
                const inp = document.getElementById('linp-'+qNum);
                if(inp) userAnswer = inp.value.trim();
            } else {
                document.querySelectorAll(`input[name="lq${qNum}"]`).forEach(r => { if(r.checked) userAnswer = r.value; });
            }
            const isCorrect = userAnswer.toLowerCase() === q.answer.toLowerCase();
            if(isCorrect) correct++;
            details.push({q:q.q, user:userAnswer||'(empty)', correct:q.answer, ok:isCorrect});
        });
    });

    const band = getBand(correct, total);
    showResults('Listening', correct, total, band, details);
}

// ===== WRITING EXAM =====
function openWritingExam(id) {
    const idx = id - 10; // writing IDs 11-15 → index 1-5
    const exam = writingExams[idx] || writingExams[1];

    document.getElementById('main-content').innerHTML = `
        <button onclick="renderMockHub()" style="color:#94a3b8;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);padding:10px 20px;border-radius:12px;cursor:pointer;font-weight:600;margin-bottom:15px;">← Back</button>
        <h1>✍️ Writing Test ${idx}</h1>
        <div class="exam-timer">
            <div><div style="color:#64748b;font-size:11px;text-transform:uppercase;">Time Remaining</div>
            <div class="timer-clock" id="exam-clock">60:00</div></div>
            <div class="timer-btns">
                <button class="submit-btn" onclick="submitWriting(${idx})">✅ Submit for AI Review</button>
            </div>
        </div>

        <div class="section-title">Task 1 — Minimum ${exam.task1.min} words</div>
        <div class="exam-panel" style="max-height:none;margin-bottom:20px;">
            <p style="white-space:pre-line;color:#e2e8f0;font-size:15px;line-height:1.8;">${exam.task1.prompt}</p>
            <textarea class="writing-area" id="w-task1" placeholder="Write your Task 1 response here..." oninput="updateWordCount('w-task1','wc1')"></textarea>
            <div class="word-count">Words: <span id="wc1">0</span> / ${exam.task1.min} minimum</div>
        </div>

        <div class="section-title">Task 2 — Minimum ${exam.task2.min} words</div>
        <div class="exam-panel" style="max-height:none;">
            <p style="white-space:pre-line;color:#e2e8f0;font-size:15px;line-height:1.8;">${exam.task2.prompt}</p>
            <textarea class="writing-area" id="w-task2" placeholder="Write your Task 2 response here..." style="min-height:450px;" oninput="updateWordCount('w-task2','wc2')"></textarea>
            <div class="word-count">Words: <span id="wc2">0</span> / ${exam.task2.min} minimum</div>
        </div>`;

    startTimer(exam.time, () => submitWriting(idx));

}

function updateWordCount(textareaId, countId) {
    const ta = document.getElementById(textareaId);
    const counter = document.getElementById(countId);
    if(!ta || !counter) return;
    const words = ta.value.trim().split(/\s+/).filter(w => w.length > 0).length;
    counter.textContent = words;
    counter.style.color = words >= parseInt(counter.parentElement.textContent.match(/\d+/g)?.[1] || 150) ? '#10b981' : '#f43f5e';
}

function submitWriting(idx) {
    clearInterval(examTimer);
    const exam = writingExams[idx] || writingExams[1];
    const t1 = document.getElementById('w-task1')?.value?.trim() || '';
    const t2 = document.getElementById('w-task2')?.value?.trim() || '';
    const wc1 = t1.split(/\s+/).filter(w=>w.length>0).length;
    const wc2 = t2.split(/\s+/).filter(w=>w.length>0).length;

    // AI-style scoring
    let t1band = 5, t2band = 5;

    // Task 1 scoring
    if(wc1 >= exam.task1.min) t1band += 1;
    if(wc1 >= exam.task1.min + 30) t1band += 0.5;
    if(t1.includes(',') && t1.includes('.')) t1band += 0.5;
    if(t1.split('.').length > 4) t1band += 0.5;
    if(/however|moreover|furthermore|in addition|consequently|therefore|whereas|while/i.test(t1)) t1band += 0.5;
    if(/significant|considerable|dramatic|substantial|approximately|respectively/i.test(t1)) t1band += 0.5;
    t1band = Math.min(t1band, 9);

    // Task 2 scoring
    if(wc2 >= exam.task2.min) t2band += 1;
    if(wc2 >= exam.task2.min + 50) t2band += 0.5;
    if(t2.split('.').length > 8) t2band += 0.5;
    if(/however|moreover|furthermore|in addition|on the other hand|nevertheless/i.test(t2)) t2band += 0.5;
    if(/in conclusion|to conclude|to sum up|in summary|overall/i.test(t2)) t2band += 0.5;
    if(/i believe|in my opinion|from my perspective|i think/i.test(t2)) t2band += 0.5;
    if(t2.split('\n').length > 3) t2band += 0.5;
    t2band = Math.min(t2band, 9);

    const overall = Math.round((t1band/3 + t2band*2/3) * 2) / 2;

    // Generate feedback
    let t1feedback = [], t2feedback = [];

    if(wc1 < exam.task1.min) t1feedback.push(`⚠️ Word count too low: ${wc1}/${exam.task1.min}. You will lose marks.`);
    else t1feedback.push(`✅ Word count met: ${wc1} words.`);
    if(!/overview|overall|general trend/i.test(t1)) t1feedback.push('⚠️ Missing overview statement. Always include a general overview.');
    else t1feedback.push('✅ Overview statement detected.');
    if(/increased|decreased|rose|fell|declined|grew|remained/i.test(t1)) t1feedback.push('✅ Good use of trend language.');
    else t1feedback.push('💡 Try using trend vocabulary: increased, decreased, rose, remained stable.');

    if(wc2 < exam.task2.min) t2feedback.push(`⚠️ Word count too low: ${wc2}/${exam.task2.min}.`);
    else t2feedback.push(`✅ Word count met: ${wc2} words.`);
    if(/in conclusion|to conclude|to sum up/i.test(t2)) t2feedback.push('✅ Conclusion detected.');
    else t2feedback.push('⚠️ No clear conclusion found. Always end with a conclusion.');
    if(/on the other hand|however|conversely|while some/i.test(t2)) t2feedback.push('✅ Both views discussed.');
    else t2feedback.push('💡 Make sure to discuss BOTH sides of the argument.');
    if(/i believe|in my opinion|i think/i.test(t2)) t2feedback.push('✅ Personal opinion included.');
    else t2feedback.push('⚠️ Include your personal opinion clearly.');
    if(/for example|for instance|such as/i.test(t2)) t2feedback.push('✅ Good use of examples.');
    else t2feedback.push('💡 Add specific examples to support your arguments.');

    document.getElementById('main-content').innerHTML = `
        <button onclick="renderMockHub()" style="color:#94a3b8;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);padding:10px 20px;border-radius:12px;cursor:pointer;font-weight:600;margin-bottom:15px;">← Back to Tests</button>
        <h1 style="text-align:center;">✍️ Writing Results</h1>
        <div style="text-align:center;margin:30px 0;">
            <div style="color:#64748b;font-size:14px;">Estimated Band Score</div>
            <div class="band-score">${overall}</div>
        </div>

        <div class="ai-feedback">
            <h3>📊 Task 1 — Band ${t1band} (${wc1} words)</h3>
            ${t1feedback.map(f => `<p>${f}</p>`).join('')}
        </div>

        <div class="ai-feedback" style="margin-top:15px;">
            <h3>📊 Task 2 — Band ${t2band} (${wc2} words)</h3>
            ${t2feedback.map(f => `<p>${f}</p>`).join('')}
        </div>

        <div class="ai-feedback" style="margin-top:15px;">
            <h3>💡 General Tips</h3>
            <p>• Task 2 is worth twice as much as Task 1 — spend 40 minutes on it.</p>
            <p>• Always plan before writing: 2-3 minutes planning saves time.</p>
            <p>• Use paragraphs: Introduction → Body 1 → Body 2 → Conclusion.</p>
            <p>• Use linking words: However, Moreover, Furthermore, In addition.</p>
            <p>• Proofread in the last 2-3 minutes for grammar and spelling.</p>
        </div>`;
    window.scrollTo(0,0);
}

// ===== SPEAKING EXAM =====
function openSpeakingExam(id) {

    if(exam.video) {
        videoHtml = `<div class="exam-audio">

            <div class="youtube-container" style="max-width:800px;margin:0 auto;">

            </div></div>`;
    }

    let partsHtml = exam.parts.map((part,pi) => `
        <div class="speaking-card">
            <h3>${part.title}</h3>
            ${part.prompts.map(p => `<p style="white-space:pre-line;margin:10px 0;padding:10px;background:rgba(255,255,255,0.03);border-radius:10px;border-left:3px solid #a855f7;">🎤 ${p}</p>`).join('')}
            ${pi === 1 ? `

    document.getElementById('main-content').innerHTML = `
        <button onclick="renderMockHub()" style="color:#94a3b8;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);padding:10px 20px;border-radius:12px;cursor:pointer;font-weight:600;margin-bottom:15px;">← Back</button>

            <div><div style="color:#64748b;font-size:11px;text-transform:uppercase;">Total Time</div>
            <div class="timer-clock" id="exam-clock">14:00</div></div>

                <button onclick="finishSpeaking()" class="submit-btn">✅ Finish</button>
            </div>
        </div>

        ${partsHtml}

        <div class="section-title">📝 Self-Assessment</div>
        <div class="exam-panel" style="max-height:none;">
            <p style="color:#94a3b8;">Rate your performance honestly:</p>
            <div class="eq-item">
                <label>Fluency & Coherence (1-9)</label>
                <input type="range" id="self-fluency" min="1" max="9" value="5" style="width:100%;" oninput="document.getElementById('sf-val').textContent=this.value">
                <span id="sf-val" style="color:#a855f7;font-weight:800;">5</span>
            </div>
            <div class="eq-item">
                <label>Lexical Resource (1-9)</label>
                <input type="range" id="self-lexical" min="1" max="9" value="5" style="width:100%;" oninput="document.getElementById('sl-val').textContent=this.value">
                <span id="sl-val" style="color:#a855f7;font-weight:800;">5</span>
            </div>
            <div class="eq-item">
                <label>Grammar Range & Accuracy (1-9)</label>
                <input type="range" id="self-grammar" min="1" max="9" value="5" style="width:100%;" oninput="document.getElementById('sg-val').textContent=this.value">
                <span id="sg-val" style="color:#a855f7;font-weight:800;">5</span>
            </div>
            <div class="eq-item">
                <label>Pronunciation (1-9)</label>
                <input type="range" id="self-pron" min="1" max="9" value="5" style="width:100%;" oninput="document.getElementById('sp-val').textContent=this.value">
                <span id="sp-val" style="color:#a855f7;font-weight:800;">5</span>
            </div>
            <button onclick="calcSpeakingScore()" style="width:100%;padding:15px;background:linear-gradient(135deg,#6366f1,#a855f7);border:none;border-radius:12px;color:white;font-weight:800;font-size:16px;cursor:pointer;margin-top:15px;">📊 Calculate My Score</button>
        </div>`;

    startTimer(840, () => {}); // 14 minutes
    window.scrollTo(0,0);
}

let speakingPrepTimer = null;
function startSpeakingTimer(btn) {
    btn.disabled = true;
    btn.textContent = '⏱ Preparing...';
    let sec = 60;
    const span = btn.nextElementSibling;
    speakingPrepTimer = setInterval(() => {
        sec--;
        span.textContent = `00:${String(sec).padStart(2,'0')}`;
        if(sec <= 0) {
            clearInterval(speakingPrepTimer);
            span.textContent = '🎤 START SPEAKING!';
            span.style.color = '#10b981';
            span.style.fontSize = '22px';
            btn.textContent = '✅ Done';

            // Now start 2-min speaking timer
            let speak = 120;
            speakingPrepTimer = setInterval(() => {
                speak--;
                span.textContent = `Speaking: ${Math.floor(speak/60)}:${String(speak%60).padStart(2,'0')}`;
                if(speak <= 0) {
                    clearInterval(speakingPrepTimer);
                    span.textContent = '⏰ Time is up!';
                    span.style.color = '#f43f5e';
                }
            }, 1000);
        }
    }, 1000);
}

function calcSpeakingScore() {
    const f = parseInt(document.getElementById('self-fluency').value);
    const l = parseInt(document.getElementById('self-lexical').value);
    const g = parseInt(document.getElementById('self-grammar').value);
    const p = parseInt(document.getElementById('self-pron').value);
    const avg = Math.round((f+l+g+p)/4 * 2) / 2;

    let tips = [];
    if(f < 6) tips.push('💡 <b>Fluency:</b> Practice speaking without long pauses. Use fillers like "well", "actually" instead of silence.');
    if(l < 6) tips.push('💡 <b>Vocabulary:</b> Learn topic-specific vocabulary. Use synonyms instead of repeating words.');
    if(g < 6) tips.push('💡 <b>Grammar:</b> Practice using a mix of simple and complex sentences. Use conditionals and passive voice.');
    if(p < 6) tips.push('💡 <b>Pronunciation:</b> Listen to native speakers. Practice word stress and intonation patterns.');
    if(avg >= 7) tips.push('🌟 Great job! Focus on maintaining consistency and natural delivery.');

    document.getElementById('main-content').innerHTML += `
        <div class="ai-feedback" style="margin-top:25px;text-align:center;">
            <h3>🗣️ Your Speaking Estimate</h3>
            <div class="band-score">${avg}</div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px;text-align:left;">
                <div class="res-correct">Fluency: ${f}/9</div>
                <div class="res-correct">Vocabulary: ${l}/9</div>
                <div class="res-correct">Grammar: ${g}/9</div>
                <div class="res-correct">Pronunciation: ${p}/9</div>
            </div>
            <div style="text-align:left;margin-top:20px;">
                ${tips.map(t => `<p>${t}</p>`).join('')}
            </div>
        </div>`;
    window.scrollTo(0, document.body.scrollHeight);
}

function finishSpeaking() {
    clearInterval(examTimer);
    clearInterval(speakingPrepTimer);
    alert('Speaking test finished! Scroll down to self-assess your performance.');
}

// ===== RESULTS DISPLAY (Reading + Listening) =====
function showResults(type, correct, total, band, details) {
    let detailsHtml = details.map(d => `
        <div class="${d.ok ? 'res-correct' : 'res-wrong'}">
            <b>${d.q.substring(0,30)}...</b><br>
            Your: ${d.user}<br>
            ${d.ok ? '✅' : '❌ Correct: '+d.correct}
        </div>
    `).join('');

    document.getElementById('main-content').innerHTML = `
        <button onclick="renderMockHub()" style="color:#94a3b8;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);padding:10px 20px;border-radius:12px;cursor:pointer;font-weight:600;margin-bottom:15px;">← Back to Tests</button>
        <h1 style="text-align:center;">${type === 'Reading' ? '📖' : '🎧'} ${type} Results</h1>
        <div style="text-align:center;margin:30px 0;">
            <div style="color:#64748b;font-size:14px;">Your Band Score</div>
            <div class="band-score">${band}</div>
            <p style="color:#94a3b8;margin-top:10px;">${correct} / ${total} correct (${Math.round(correct/total*100)}%)</p>
        </div>
        <div class="section-title">📋 Detailed Answers</div>
        <div class="results-grid">${detailsHtml}</div>

        <div class="ai-feedback" style="margin-top:25px;">
            <h3>💡 Tips to Improve</h3>
            ${band < 6 ? '<p>⚠️ Focus on understanding question types. Practice skimming and scanning techniques.</p>' : ''}
            ${band >= 6 && band < 7.5 ? '<p>📈 Good progress! Work on time management and tricky question types like T/F/NG.</p>' : ''}
            ${band >= 7.5 ? '<p>🌟 Excellent! Fine-tune your skills by practicing with harder passages and strict timing.</p>' : ''}
            <p>• Review all incorrect answers and learn the patterns.</p>
            <p>• Practice under timed conditions regularly.</p>
            <p>• For ${type}, aim to spend no more than ${type==='Reading'?'20 minutes per passage':'5 minutes per section reviewing'}.</p>
        </div>

        <button onclick="renderMockHub()" class="mock-btn" style="background:linear-gradient(135deg,#6366f1,#a855f7);">🔄 Try Another Test</button>`;
    window.scrollTo(0,0);
}
