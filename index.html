<html lang="en">
<head>
    <meta charset="UTF-8">

    <style>

        :root {
            --primary: #6366f1;
            --accent: #a855f7;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.8);
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg);
            color: #f1f5f9;
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 260px;
            background: #111827;
            border-right: 1px solid var(--border);
            padding: 30px 20px;
            position: fixed;
            height: 100vh;
            z-index: 1000;
            overflow-y: auto;
        }

        .insta-link {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #e2e8f0;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 15px;
            border-radius: 12px;
            margin-bottom: 25px;
            border: 1px solid var(--border);
            transition: 0.3s;
        }
        .insta-link:hover {
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            border-color: transparent;
            transform: translateY(-2px);
        }
        .insta-link span { font-size: 13px; font-weight: 600; }

        .nav-links { list-style: none; padding: 0; margin-top: 20px; }
        .nav-links li { margin-bottom: 10px; }
        .nav-links a {
            color: #94a3b8; text-decoration: none; padding: 12px 15px;
            display: block; border-radius: 10px; cursor: pointer; transition: 0.3s;
        }
        .nav-links a:hover, .nav-links a.active { background: var(--primary); color: white; }

        .nav-section-label {
            color: #475569;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 20px 15px 8px;
            border-top: 1px solid var(--border);
            margin-top: 10px;
        }

        .header-progress {
            position: fixed;
            top: 0;
            left: 260px;
            right: 0;
            padding: 15px 40px;
            background: rgba(15, 23, 42, 0.9);
            z-index: 900;
            border-bottom: 1px solid var(--border);
        }
        .progress-bar-bg { background: rgba(255,255,255,0.05); height: 8px; border-radius: 4px; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: linear-gradient(to right, var(--primary), var(--accent)); width: 0%; transition: 0.5s; }

        .main-wrap {
            margin-left: 260px;
            padding: 100px 40px 40px;
            width: calc(100% - 260px);
            display: flex;
            justify-content: center;
        }

        .card {
            width: 100%;
            max-width: 1000px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .video-wrapper { width: 100%; margin: 20px 0; border-radius: 20px; overflow: hidden; border: 1px solid var(--border); }
        .youtube-container { position: relative; padding-bottom: 56.25%; height: 0; }
        .youtube-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

        .quiz-container { text-align: left; background: rgba(255,255,255,0.02); padding: 30px; border-radius: 20px; margin: 30px 0; border: 1px solid var(--border); }
        .quiz-item { margin-bottom: 25px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 15px; }
        .quiz-options button {
            display: block; width: 100%; text-align: left; padding: 12px; margin: 8px 0;
            background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: white;
            border-radius: 8px; cursor: pointer; transition: 0.3s;
        }
        .quiz-options button:hover { background: rgba(255,255,255,0.1); }

        .pdf-section { width: 100%; margin-top: 30px; }
        .pdf-wrapper {
            width: 100% !important;
            height: 800px !important;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            border: 2px solid var(--border);
        }
        .pdf-wrapper iframe { width: 100%; height: 100%; border: none; }

        .mock-btn {
            background: linear-gradient(135deg, #f43f5e, #e11d48); color: white;
            border: none; padding: 18px 35px; border-radius: 15px; font-weight: 800;
            cursor: pointer; margin-top: 30px; width: 100%; font-size: 16px;
            transition: 0.3s;
        }
        .mock-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(244,63,94,0.4); }

        /* ==================== MOCK HUB STYLES ==================== */
        .mock-hub-header { text-align: center; margin-bottom: 40px; }
        .mock-hub-header h1 {
            font-size: 36px; font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--accent), #f43f5e);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            margin-bottom: 10px;
        }
        .mock-hub-header p { color: #94a3b8; font-size: 16px; }

        .filter-tabs { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 35px; }
        .filter-tab {
            padding: 10px 22px; border-radius: 50px; border: 1px solid var(--border);
            background: rgba(255,255,255,0.03); color: #94a3b8; font-weight: 600;
            font-size: 14px; cursor: pointer; transition: 0.3s;
        }
        .filter-tab:hover { background: rgba(255,255,255,0.08); color: white; }
        .filter-tab.active {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white; border-color: transparent;
            box-shadow: 0 4px 15px rgba(99,102,241,0.4);
        }

        .mock-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 35px; }
        .stat-card {
            background: rgba(255,255,255,0.03); border: 1px solid var(--border);
            border-radius: 16px; padding: 20px; text-align: center; transition: 0.3s;
        }
        .stat-card:hover { transform: translateY(-3px); border-color: var(--primary); }
        .stat-card .stat-num {
            font-size: 28px; font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .stat-card .stat-label { font-size: 12px; color: #64748b; margin-top: 5px; text-transform: uppercase; letter-spacing: 1px; }

        .mock-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }

        .mock-card {
            background: rgba(255,255,255,0.03); border: 1px solid var(--border);
            border-radius: 20px; padding: 25px; transition: 0.4s; position: relative; overflow: hidden;
        }
        .mock-card::before {
            content: ''; position: absolute; top: 0; left: 0;
            width: 100%; height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            opacity: 0; transition: 0.3s;
        }
        .mock-card:hover {
            transform: translateY(-5px); border-color: var(--primary);
            box-shadow: 0 15px 40px rgba(99,102,241,0.2);
        }
        .mock-card:hover::before { opacity: 1; }

        .mock-card-icon {
            width: 50px; height: 50px; border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; margin-bottom: 15px;
        }
        .mock-card-icon.listening { background: rgba(99,102,241,0.15); }
        .mock-card-icon.reading { background: rgba(16,185,129,0.15); }
        .mock-card-icon.writing { background: rgba(245,158,11,0.15); }
        .mock-card-icon.speaking { background: rgba(239,68,68,0.15); }
        .mock-card-icon.full { background: rgba(168,85,247,0.15); }

        .mock-card-title { font-size: 16px; font-weight: 700; color: #e2e8f0; margin-bottom: 8px; }
        .mock-card-meta { font-size: 12px; color: #64748b; margin-bottom: 15px; }
        .mock-card-meta span { margin-right: 12px; }

        .mock-card-tags { display: flex; gap: 8px; flex-wrap: wrap; }
        .mock-tag {
            padding: 4px 10px; border-radius: 6px; font-size: 11px;
            font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .mock-tag.listening { background: rgba(99,102,241,0.15); color: #818cf8; }
        .mock-tag.reading { background: rgba(16,185,129,0.15); color: #34d399; }
        .mock-tag.writing { background: rgba(245,158,11,0.15); color: #fbbf24; }
        .mock-tag.speaking { background: rgba(239,68,68,0.15); color: #f87171; }
        .mock-tag.full { background: rgba(168,85,247,0.15); color: #c084fc; }
        .mock-tag.easy { background: rgba(16,185,129,0.15); color: #34d399; }
        .mock-tag.medium { background: rgba(245,158,11,0.15); color: #fbbf24; }
        .mock-tag.hard { background: rgba(239,68,68,0.15); color: #f87171; }

        .mock-card-btn {
            margin-top: 18px; width: 100%; padding: 12px;
            border: 1px solid var(--border); border-radius: 12px;
            background: rgba(255,255,255,0.03); color: #94a3b8;
            font-weight: 600; font-size: 13px; cursor: pointer; transition: 0.3s;
        }
        .mock-card-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }

        .back-btn {
            display: inline-flex; align-items: center; gap: 8px;
            color: #94a3b8; background: rgba(255,255,255,0.05);
            border: 1px solid var(--border); padding: 10px 20px;
            border-radius: 12px; cursor: pointer; font-weight: 600;
            font-size: 14px; transition: 0.3s; margin-bottom: 25px;
        }
        .back-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }
    </style>
</head>
