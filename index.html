<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');

        :root {
            --primary: #6366f1;
            --accent: #a855f7;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.8);
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg);
            color: #f1f5f9;
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background: #111827;
            border-right: 1px solid var(--border);
            padding: 30px 20px;
            position: fixed;
            height: 100vh;
            z-index: 1000;
        }

        /* Instagram Link Style */
        .insta-link {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #e2e8f0;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 15px;
            border-radius: 12px;
            margin-bottom: 25px;
            border: 1px solid var(--border);
            transition: 0.3s;
        }
        .insta-link:hover {
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            border-color: transparent;
            transform: translateY(-2px);
        }
        .insta-link span { font-size: 13px; font-weight: 600; }

        .nav-links { list-style: none; padding: 0; margin-top: 20px; }
        .nav-links li { margin-bottom: 10px; }
        .nav-links a { 
            color: #94a3b8; text-decoration: none; padding: 12px 15px; 
            display: block; border-radius: 10px; cursor: pointer; transition: 0.3s;
        }
        .nav-links a:hover, .nav-links a.active { background: var(--primary); color: white; }

        /* Progress Bar Top Center */
        .header-progress {
            position: fixed;
            top: 0;
            left: 260px;
            right: 0;
            padding: 15px 40px;
            background: rgba(15, 23, 42, 0.9);
            z-index: 900;
            border-bottom: 1px solid var(--border);
        }
        .progress-bar-bg { background: rgba(255,255,255,0.05); height: 8px; border-radius: 4px; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: linear-gradient(to right, var(--primary), var(--accent)); width: 0%; transition: 0.5s; }

        /* Main Content */
        .main-wrap { 
            margin-left: 260px; 
            padding: 100px 40px 40px; 
            width: calc(100% - 260px);
            display: flex;
            justify-content: center;
        }

        .card { 
            width: 100%;
            max-width: 900px;
            background: var(--card-bg); 
            border: 1px solid var(--border); 
            border-radius: 30px; 
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        /* Video */
        .video-wrapper { width: 100%; margin: 20px 0; border-radius: 20px; overflow: hidden; border: 1px solid var(--border); }
        .youtube-container { position: relative; padding-bottom: 56.25%; height: 0; }
        .youtube-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

        /* Quiz */
        .quiz-container { text-align: left; background: rgba(255,255,255,0.02); padding: 30px; border-radius: 20px; margin: 30px 0; border: 1px solid var(--border); }
        .quiz-item { margin-bottom: 25px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 15px; }
        .quiz-options button { 
            display: block; width: 100%; text-align: left; padding: 12px; margin: 8px 0; 
            background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: white; 
            border-radius: 8px; cursor: pointer; 
        }

        /* PDF - FIXED */
        .pdf-section { width: 100%; margin-top: 30px; }
        .pdf-wrapper { 
            width: 100% !important; 
            height: 800px !important; 
            background: white; 
            border-radius: 15px; 
            overflow: hidden;
            border: 2px solid var(--border);
        }
        .pdf-wrapper iframe { width: 100%; height: 100%; border: none; }

        .mock-btn { 
            background: linear-gradient(135deg, #f43f5e, #e11d48); color: white; 
            border: none; padding: 18px 35px; border-radius: 15px; font-weight: 800; 
            cursor: pointer; margin-top: 30px; width: 100%; font-size: 16px;
        }
    </style>
</head>

var completed = new Set();
var currentMockFilter = "all";

function setActiveNav(id) {
    var links = document.querySelectorAll(".nav-links a");
    for (var i = 0; i < links.length; i++) {
        links[i].classList.remove("active");
    }
    var el = document.getElementById(id);
    if (el) el.classList.add("active");
}

function updateProgress() {
    var pct = Math.round(completed.size / 4 * 100);
    document.getElementById("p-fill").style.width = pct + "%";
    document.getElementById("p-percent").innerText = pct + "%";
}

function checkQuiz(btn, isCorrect) {
    btn.style.background = isCorrect ? "#16a34a" : "#dc2626";
    btn.style.color = "white";
    btn.style.borderColor = isCorrect ? "#16a34a" : "#dc2626";
}

function showDashboard() {
    setActiveNav("nav-dashboard");
    var mc = document.getElementById("main-content");
    mc.innerHTML = "";

    var h = document.createElement("h1");
    h.textContent = "Welcome!";
    mc.appendChild(h);

    var p = document.createElement("p");
    p.textContent = "Select a module to continue your IELTS preparation with Lyazzat Teacher.";
    mc.appendChild(p);

    var vw = document.createElement("div");
    vw.className = "video-wrapper";

    vid.controls = true;
    vid.style.width = "100%";

    src.type = "video/mp4";
    vid.appendChild(src);
    vw.appendChild(vid);
    mc.appendChild(vw);

    window.scrollTo(0, 0);
}

function showModule(name) {
    var key = name.toLowerCase();
    setActiveNav("nav-" + key);
    completed.add(key);
    updateProgress();

    var mc = document.getElementById("main-content");
    mc.innerHTML = "";

    // Title
    var h = document.createElement("h1");
    h.style.textAlign = "left";
    h.textContent = name + " Module";
    mc.appendChild(h);

    // YouTube Video
    var vw = document.createElement("div");
    vw.className = "video-wrapper";
    var yc = document.createElement("div");
    yc.className = "youtube-container";
    var iframe = document.createElement("iframe");
    iframe.src = "https://www.youtube.com/embed/" + ytData.lessons[key];
    iframe.allowFullscreen = true;
    yc.appendChild(iframe);
    vw.appendChild(yc);
    mc.appendChild(vw);

    // Quiz
    var qc = document.createElement("div");
    qc.className = "quiz-container";
    var qh = document.createElement("h2");
    qh.textContent = "Module Quiz";
    qc.appendChild(qh);

    var questions = quizData[key];
    for (var i = 0; i < questions.length; i++) {
        var item = questions[i];
        var qi = document.createElement("div");
        qi.className = "quiz-item";

        var qp = document.createElement("p");
        var qb = document.createElement("b");
        qb.textContent = (i + 1) + ". " + item.q;
        qp.appendChild(qb);
        qi.appendChild(qp);

        var opts = document.createElement("div");
        opts.className = "quiz-options";
        for (var j = 0; j < item.a.length; j++) {
            var btn = document.createElement("button");
            btn.textContent = item.a[j];
            btn.setAttribute("data-correct", j === item.correct ? "true" : "false");
            btn.onclick = function() {
                checkQuiz(this, this.getAttribute("data-correct") === "true");
            };
            opts.appendChild(btn);
        }
        qi.appendChild(opts);
        qc.appendChild(qi);
    }
    mc.appendChild(qc);

    // PDF
    var ps = document.createElement("div");
    ps.className = "pdf-section";
    var ph = document.createElement("h2");
    ph.style.textAlign = "left";
    ph.textContent = "Study Guide";
    ps.appendChild(ph);

    var pw = document.createElement("div");
    pw.className = "pdf-wrapper";
    var pf = document.createElement("iframe");
    pf.src = "materials/" + key + ".pdf";
    pw.appendChild(pf);
    ps.appendChild(pw);
    mc.appendChild(ps);

    // Mock Test Button
    var mb = document.createElement("button");
    mb.className = "mock-btn";
    mb.textContent = "Take " + name + " Mock Test";
    mb.onclick = function() { showMockTest(key); };
    mc.appendChild(mb);

    window.scrollTo(0, 0);
}

function showMockTest(key) {
    var mc = document.getElementById("main-content");
    mc.innerHTML = "";

    var h = document.createElement("h1");
    h.textContent = key.charAt(0).toUpperCase() + key.slice(1) + " — Mock Test";
    mc.appendChild(h);

    // Video if exists
    if (ytData.mocks[key]) {
        var vw = document.createElement("div");
        vw.className = "video-wrapper";

/* ============ MOCK HUB ============ */

function showMockHub() {
    setActiveNav("nav-mocks");
    var mc = document.getElementById("main-content");
    mc.innerHTML = "";

    // Header
    var header = document.createElement("div");
    header.className = "mock-hub-header";
    var h1 = document.createElement("h1");
    h1.textContent = "Mock Tests Hub";
    header.appendChild(h1);
    var p = document.createElement("p");
    p.textContent = "Practice with real IELTS-style tests. Choose a category and start!";
    header.appendChild(p);
    mc.appendChild(header);

    // Stats
    var stats = document.createElement("div");
    stats.className = "mock-stats";

    var types = [
        { label: "Full Tests", count: mockTests.filter(function(t){ return t.type==="full"; }).length },
        { label: "Listening", count: mockTests.filter(function(t){ return t.type==="listening"; }).length },
        { label: "Reading", count: mockTests.filter(function(t){ return t.type==="reading"; }).length },
        { label: "Writing + Speaking", count: mockTests.filter(function(t){ return t.type==="writing"||t.type==="speaking"; }).length }
    ];
    for (var s = 0; s < types.length; s++) {
        var sc = document.createElement("div");
        sc.className = "stat-card";
        var sn = document.createElement("div");
        sn.className = "stat-num";
        sn.textContent = types[s].count;
        sc.appendChild(sn);
        var sl = document.createElement("div");
        sl.className = "stat-label";
        sl.textContent = types[s].label;
        sc.appendChild(sl);
        stats.appendChild(sc);
    }
    mc.appendChild(stats);

    // Filter tabs
    var tabs = document.createElement("div");
    tabs.className = "filter-tabs";
    tabs.id = "mock-filter-tabs";

    var filters = ["all", "full", "listening", "reading", "writing", "speaking"];
    var filterLabels = ["🌐 All", "📋 Full Test", "🎧 Listening", "📖 Reading", "✍️ Writing", "🗣️ Speaking"];
    for (var f = 0; f < filters.length; f++) {
        var tab = document.createElement("div");
        tab.className = "filter-tab" + (filters[f] === currentMockFilter ? " active" : "");
        tab.textContent = filterLabels[f];
        tab.setAttribute("data-filter", filters[f]);
        tab.onclick = function() {
            currentMockFilter = this.getAttribute("data-filter");
            showMockHub();
        };
        tabs.appendChild(tab);
    }
    mc.appendChild(tabs);

    // Grid
    var grid = document.createElement("div");
    grid.className = "mock-grid";

    var filtered = mockTests;
    if (currentMockFilter !== "all") {
        filtered = mockTests.filter(function(t) { return t.type === currentMockFilter; });
    }

    for (var m = 0; m < filtered.length; m++) {
        var test = filtered[m];
        var card = document.createElement("div");
        card.className = "mock-card";

        // Icon
        var icon = document.createElement("div");
        icon.className = "mock-card-icon " + test.type;
        icon.textContent = test.icon;
        card.appendChild(icon);

        // Title
        var title = document.createElement("div");
        title.className = "mock-card-title";
        title.textContent = test.title;
        card.appendChild(title);

        // Meta
        var meta = document.createElement("div");
        meta.className = "mock-card-meta";
        var spanTime = document.createElement("span");
        spanTime.textContent = "⏱ " + test.duration;
        meta.appendChild(spanTime);
        var spanQ = document.createElement("span");
        spanQ.textContent = "❓ " + test.questions + " questions";
        meta.appendChild(spanQ);
        card.appendChild(meta);

        // Tags
        var tags = document.createElement("div");
        tags.className = "mock-card-tags";

        var tagType = document.createElement("span");
        tagType.className = "mock-tag " + test.type;
        tagType.textContent = test.type;
        tags.appendChild(tagType);

        var tagDiff = document.createElement("span");
        tagDiff.className = "mock-tag " + test.difficulty.toLowerCase();
        tagDiff.textContent = test.difficulty;
        tags.appendChild(tagDiff);

        if (test.video) {
            var tagVid = document.createElement("span");
            tagVid.className = "mock-tag listening";
            tagVid.textContent = "🎬 Video";
            tags.appendChild(tagVid);
        }

        card.appendChild(tags);

        // Button
        var btn = document.createElement("button");
        btn.className = "mock-card-btn";
        btn.textContent = "Start Test →";
        btn.setAttribute("data-id", test.id);
        btn.onclick = function() {
            var id = parseInt(this.getAttribute("data-id"));
            openMockTest(id);
        };
        card.appendChild(btn);

        grid.appendChild(card);
    }
    mc.appendChild(grid);

    window.scrollTo(0, 0);
}

function openMockTest(id) {
    var test = null;
    for (var i = 0; i < mockTests.length; i++) {
        if (mockTests[i].id === id) { test = mockTests[i]; break; }
    }
    if (!test) return;

    var mc = document.getElementById("main-content");
    mc.innerHTML = "";

    // Back button
    var back = document.createElement("button");
    back.className = "back-btn";
    back.textContent = "← Back to Mock Tests";
    back.onclick = function() { showMockHub(); };
    mc.appendChild(back);

    // Title
    var h = document.createElement("h1");
    h.style.textAlign = "left";
    h.textContent = test.icon + " " + test.title;
    mc.appendChild(h);

    // Info
    var info = document.createElement("div");
    info.className = "mock-card-meta";
    info.style.fontSize = "14px";
    info.style.marginBottom = "25px";
    info.innerHTML = "<span>⏱ " + test.duration + "</span>" +
                     "<span>❓ " + test.questions + " questions</span>" +
                     "<span>📊 " + test.difficulty + "</span>";
    mc.appendChild(info);

    // Video if exists
    if (test.video) {
        var vh = document.createElement("h2");
        vh.style.textAlign = "left";
        vh.textContent = "🎬 Audio / Video";
        mc.appendChild(vh);

        var vw = document.createElement("div");
        vw.className = "video-wrapper";
        var yc = document.createElement("div");
        yc.className = "youtube-container";
        var iframe = document.createElement("iframe");
        iframe.src = "https://www.youtube.com/embed/" + test.video;
        iframe.allowFullscreen = true;
        yc.appendChild(iframe);
        vw.appendChild(yc);
        mc.appendChild(vw);
    }

    // PDF
    var ph = document.createElement("h2");
    ph.style.textAlign = "left";
    ph.style.marginTop = "30px";
    ph.textContent = "📄 Test Paper";
    mc.appendChild(ph);

    var pw = document.createElement("div");
    pw.className = "pdf-wrapper";
    var pf = document.createElement("iframe");
    pf.src = test.pdf;
    pw.appendChild(pf);
    mc.appendChild(pw);

    window.scrollTo(0, 0);
}
</script>
</body>
</html>
